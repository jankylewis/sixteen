<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Library · QE sandbox</title>
<style>body{font:18px/1.6 system-ui;max-width:720px;margin:40px auto;padding:20px;background:#232136;color:#e0def4}input,button{font:inherit;padding:10px;margin:8px 0}button{cursor:pointer}section{border:2px solid #9ccfd8;padding:20px;margin-top:20px}h1,h2{color:#f6c177}:focus-visible{outline:3px solid #f6c177}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h1>Pocket Library</h1><p>Local QE sandbox. Reader IDs are synthetic test partitions, not authentication. Restart the server to reset data.</p>
<label for="reader">Reader ID</label><br><input id="reader" value="qe-one" maxlength="40" pattern="[a-zA-Z0-9_-]+">
<section><h2>The Test Garden</h2><p>Book ID: book-1 · Available</p><button id="reserve">Reserve The Test Garden</button></section>
<section><h2>The Missing Moon</h2><p>Book ID: book-2 · Unavailable</p><button disabled>Reserve The Missing Moon</button></section>
<p id="status" role="status" aria-live="polite">Ready</p><button id="read">Read my reservations</button><pre id="records" aria-label="Reservation records">No read performed</pre>
<script type="module">
const reader = document.querySelector('#reader');
const status = document.querySelector('#status');
const records = document.querySelector('#records');
async function request(options) {
  return fetch('/api/reservations', { ...options, headers: { 'X-Reader': reader.value, 'Content-Type': 'application/json' }, signal: AbortSignal.timeout(3000) });
}
document.querySelector('#reserve').addEventListener('click', async () => {
  try {
    const response = await request({ method: 'POST', body: JSON.stringify({ book: 'book-1' }) });
    const value = await response.json(); status.textContent = value.message ?? value.error;
  } catch { status.textContent = 'Request failed; inspect state before retrying'; }
});
document.querySelector('#read').addEventListener('click', async () => {
  try {
    const response = await request({ method: 'GET' });
    const value = await response.json();
    records.textContent = response.ok ? JSON.stringify(value, null, 2) : `Read failed: ${value.error}`;
  } catch { records.textContent = 'Read unavailable; outcome unresolved'; }
});
</script></body></html>
